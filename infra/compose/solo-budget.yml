# Local/self-host budget profile. Credentials below are synthetic local defaults only.
# Application and optional heavy services are opt-in Compose profiles.
name: rei-os-solo

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rei_os
      POSTGRES_USER: rei
      POSTGRES_PASSWORD: rei
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rei -d rei_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: [full-data]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  opensearch:
    image: opensearchproject/opensearch:2
    profiles: [full-data]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "LocalOnly-Admin-123!"
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data

  api:
    profiles: [app]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api-runtime
    environment:
      NODE_ENV: production
      APP_ENV: local
      API_PORT: "3001"
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3001
      DATABASE_URL: postgresql://rei:rei@postgres:5432/rei_os
      REDIS_URL: redis://redis:6379/0
      SEARCH_PROVIDER: disabled
      OBJECT_STORAGE_PROVIDER: local
      AUTH_PROVIDER: built-in
      SESSION_SECRET: "${SESSION_SECRET:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    profiles: [app]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10

  local-llm:
    profiles: [local-ai]
    image: "${LOCAL_LLM_IMAGE:-ollama/ollama:latest}"
    ports:
      - "11434:11434"
    volumes:
      - local_llm_data:/root/.ollama

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ../otel/collector-config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
      - "13133:13133"

  prometheus:
    profiles: [observability]
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on: [otel-collector]

  grafana:
    profiles: [observability]
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-}"
    volumes:
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"
    depends_on: [prometheus]

volumes:
  pgdata:
  miniodata:
  osdata:
  local_llm_data:
