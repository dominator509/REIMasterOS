# Configurable adapter profile. Vendor credentials are optional and injected at runtime only.
name: rei-os-vendor

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rei_os
      POSTGRES_USER: rei
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rei -d rei_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:?set MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?set MINIO_PASSWORD}"
    volumes: [miniodata:/data]

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD}"
    volumes: [osdata:/usr/share/opensearch/data]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api-runtime
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_PORT: "3001"
      APP_BASE_URL: "${APP_BASE_URL:?set APP_BASE_URL}"
      API_BASE_URL: "${API_BASE_URL:?set API_BASE_URL}"
      DATABASE_URL: "postgresql://rei:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/rei_os"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0"
      SEARCH_PROVIDER: opensearch
      SEARCH_URL: https://opensearch:9200
      OBJECT_STORAGE_PROVIDER: minio
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-rei-os}"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: "${MINIO_USER:?set MINIO_USER}"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "${MINIO_PASSWORD:?set MINIO_PASSWORD}"
      AUTH_PROVIDER: built-in
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    ports: ["3001:3001"]
    depends_on: [postgres, redis, minio, opensearch]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  osdata:
