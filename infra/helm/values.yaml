replicaCount: 1
image:
  repository: rei-os/api
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3001
ingress:
  enabled: false
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi
env:
  NODE_ENV: production
  APP_ENV: production
  SEARCH_PROVIDER: disabled
  OBJECT_STORAGE_PROVIDER: local
secrets:
  databaseUrl: ""
  sessionSecret: ""
  encryptionKey: ""
