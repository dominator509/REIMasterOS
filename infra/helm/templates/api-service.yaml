{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rei-os.fullname" . }}-api
  labels:
    {{- include "rei-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rei-os.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
